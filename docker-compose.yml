services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-6008}:${BACKEND_PORT:-6008}"
    env_file:
      - ./.env
    environment:
      PORT: "${BACKEND_PORT:-6008}"
    command: sh -c "npm run migrate:deploy && npm run dev"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "${FRONTEND_PORT:-6009}"
      VITE_API_URL: "${VITE_API_URL:-http://localhost:${BACKEND_PORT:-6008}/api}"
      VITE_ALLOWED_HOSTS: "${VITE_ALLOWED_HOSTS:-play.dodon.in,localhost,192.168.1.3}"
    ports:
      - "${FRONTEND_PORT:-6009}:${FRONTEND_PORT:-6009}"
    depends_on:
      - backend

  # One entry point (infrastructure/gateway/nginx.conf): the frontend at /
  # and the backend at /api/. The tunnel publishes this; on the LAN it is
  # http://<host>:GATEWAY_PORT.
  gateway:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${GATEWAY_PORT:-6010}:80"
    volumes:
      # nginx.conf and proxy.inc, which it includes
      - ./infrastructure/gateway:/etc/nginx/conf.d:ro

  # Cloudflare Tunnel to the gateway, so the app is reachable at
  # https://play.dodon.in. CLOUDFLARE_TUNNEL_TOKEN identifies the tunnel;
  # an empty token makes it exit and the rest of the stack runs.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    depends_on:
      - gateway
    command: ["tunnel", "--no-autoupdate", "run", "--url", "http://gateway:80"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
