# The gateway: one entry point for the frontend and the API, so one tunnel
# (cloudflared) or one LAN port publishes both.
#
#   <host>/        the frontend (Vite dev server, with its HMR websocket)
#   <host>/api/    the backend (Express), docs at /api/docs
#
# Ports follow FRONTEND_PORT / BACKEND_PORT in .env (defaults 6009 / 6008).
# Upstreams are resolved per request through Docker's DNS, so a container
# that restarts with a new address is found again.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare terminates TLS; keep the scheme it saw for the apps' own links
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# quiz workbooks are uploaded through /api/admin/quizzes/upload
client_max_body_size 50m;
absolute_redirect off;

server {
    listen 80 default_server;

    set $frontend frontend:6009;
    set $backend  backend:6008;

    location /api/ {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://$backend;
    }

    location / {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://$frontend;
    }
}
